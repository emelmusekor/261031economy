name: Apply reviewed visual fixes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-reviewed-polish.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply the reviewed deterministic edits
        run: python scripts/reviewed-polish.py
      - name: Recheck all source and model tests
        run: |
          node --check app.js
          node --check labs.js
          node scripts/verify.cjs
      - name: Commit only the reviewed website changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js labs.js styles.css
          if ! git diff --cached --quiet; then
            git commit -m 'Refine SVG axes, signed bars and mobile chart typography'
            git push origin HEAD:main
          fi
